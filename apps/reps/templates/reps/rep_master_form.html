{# Shared Add / Modify / View form. rep_master_form.js switches the mode. #}
<dialog class="modal rep-form-modal" id="rep-form-dialog" aria-labelledby="rep-form-title">
  <form novalidate data-rep-form>
    <header class="modal__header">
      <h2 class="modal__title" id="rep-form-title">Rep Master — <span data-mode-label>Add</span></h2>
      <button class="modal__close" type="button" aria-label="Close" data-form-exit>&times;</button>
    </header>

    <div class="modal__body">
      <div class="alert alert--error form-alert" role="alert" data-form-alert hidden></div>

      <div class="mform rep-form">
        <label class="mform__label" for="rep-code">Rep Code</label>
        <div class="mform__field">
          <input class="form-control mform__input mform__input--code rep-code" id="rep-code" type="text" readonly tabindex="-1" placeholder="Auto" data-field="code">
        </div>

        <label class="mform__label mform__label--required" for="rep-name">Rep Name</label>
        <div class="mform__field">
          <input class="form-control mform__input" id="rep-name" name="name" type="text" maxlength="25" autocomplete="off" data-field="name">
          <p class="mform__error" data-error-for="name"></p>
        </div>

        <label class="mform__label" for="rep-father_name">Father Name</label>
        <div class="mform__field">
          <input class="form-control mform__input" id="rep-father_name" name="father_name" type="text" maxlength="25" autocomplete="off" data-field="father_name">
          <p class="mform__error" data-error-for="father_name"></p>
        </div>

        <label class="mform__label" for="rep-address_1">Address 1</label>
        <div class="mform__field">
          <input class="form-control mform__input" id="rep-address_1" name="address_1" type="text" maxlength="30" autocomplete="off" data-field="address_1">
          <p class="mform__error" data-error-for="address_1"></p>
        </div>

        <label class="mform__label" for="rep-address_2">Address 2</label>
        <div class="mform__field">
          <input class="form-control mform__input" id="rep-address_2" name="address_2" type="text" maxlength="30" autocomplete="off" data-field="address_2">
          <p class="mform__error" data-error-for="address_2"></p>
        </div>

        <label class="mform__label" for="rep-address_3">Address 3</label>
        <div class="mform__field">
          <input class="form-control mform__input" id="rep-address_3" name="address_3" type="text" maxlength="30" autocomplete="off" data-field="address_3">
          <p class="mform__error" data-error-for="address_3"></p>
        </div>

        <label class="mform__label" for="rep-permanent_location">Permanent Location</label>
        <div class="mform__field">
          <input class="form-control mform__input" id="rep-permanent_location" name="permanent_location" type="text" maxlength="30" autocomplete="off" data-field="permanent_location">
          <p class="mform__error" data-error-for="permanent_location"></p>
        </div>

        <label class="mform__label" for="rep-mobile">Mobile Number</label>
        <div class="mform__field">
          <input class="form-control mform__input rep-mid" id="rep-mobile" name="mobile" type="tel" inputmode="tel" maxlength="16" autocomplete="off" data-field="mobile">
          <p class="mform__error" data-error-for="mobile"></p>
        </div>
      </div>
    </div>

    <footer class="modal__footer">
      <button class="btn btn--primary" type="submit" data-form-confirm>Confirm</button>
      <button class="btn btn--secondary" type="button" data-form-exit>Exit</button>
    </footer>
  </form>

  <div class="modal-discard" data-discard hidden>
    <div class="modal-discard__box" role="alertdialog" aria-labelledby="rep-discard-title">
      <p class="modal-discard__title" id="rep-discard-title">Discard unsaved changes?</p>
      <div class="modal-discard__actions">
        <button class="btn btn--secondary" type="button" data-discard-cancel>Cancel</button>
        <button class="btn btn--primary" type="button" data-discard-confirm>Exit</button>
      </div>
    </div>
  </div>
</dialog>
