{# Shared ADD / MODIFY form (old VFP "CREDITOR OUTSTANDING" window). creditor_outstanding.js switches the mode. #}
<dialog class="modal co-form-modal" id="co-form-dialog" aria-labelledby="co-form-title">
  <form novalidate data-co-form>
    <header class="modal__header">
      <h2 class="modal__title" id="co-form-title">Creditor Outstanding — <span data-mode-label>Add</span></h2>
      <button class="modal__close" type="button" aria-label="Close" data-form-exit>&times;</button>
    </header>

    <div class="modal__body">
      <div class="alert alert--error form-alert" role="alert" data-form-alert hidden></div>

      <div class="mform co-form">
        <label class="mform__label mform__label--required" for="co-div">Div</label>
        <div class="mform__field">
          <input class="form-control mform__input co-short" id="co-div" name="div" type="text" maxlength="2" autocomplete="off" data-field="div">
          <p class="mform__error" data-error-for="div"></p>
        </div>

        <label class="mform__label mform__label--required" for="co-bill_no">Invoice No</label>
        <div class="mform__field co-pair">
          <div>
            <input class="form-control mform__input co-mid" id="co-bill_no" name="bill_no" type="text" maxlength="5" autocomplete="off" data-field="bill_no">
            <p class="mform__error" data-error-for="bill_no"></p>
          </div>
          <label class="mform__label mform__label--required co-inline-label" for="co-bill_date">Invoice Date</label>
          <div>
            <input class="form-control mform__input co-date" id="co-bill_date" name="bill_date" type="text" inputmode="numeric" placeholder="dd/mm/yyyy" maxlength="10" autocomplete="off" data-field="bill_date" data-date-mask>
            <p class="mform__error" data-error-for="bill_date"></p>
          </div>
        </div>

        <label class="mform__label mform__label--required" for="co-party_code">Party</label>
        <div class="mform__field">
          <div class="co-party">
            <input class="form-control mform__input co-code" id="co-party_code" name="party_code" type="text" maxlength="4"
                   list="co-party-list" autocomplete="off" placeholder="Code" data-field="party_code"
                   aria-describedby="co-party-help">
            <input class="form-control mform__input co-party-search" type="text" autocomplete="off"
                   placeholder="Type vendor name to search…" list="co-party-list" data-party-search aria-label="Search vendor by name">
          </div>
          <datalist id="co-party-list" data-party-list></datalist>
          <p class="co-party-name" id="co-party-help" data-party-name></p>
          <p class="mform__error" data-error-for="party_code"></p>
        </div>

        <label class="mform__label mform__label--required" for="co-net_amount">Bal Amt</label>
        <div class="mform__field">
          <input class="form-control mform__input mform__input--num co-mid" id="co-net_amount" name="net_amount" type="text" inputmode="decimal" autocomplete="off" data-field="net_amount">
          <p class="mform__error" data-error-for="net_amount"></p>
        </div>
        <input type="hidden" id="co-cash_discount" name="cash_discount" value="0.00" data-field="cash_discount">
      </div>
    </div>

    <footer class="modal__footer">
      <button class="btn btn--primary" type="submit" data-form-confirm>Confirm</button>
      <button class="btn btn--secondary" type="button" data-form-exit>Exit</button>
    </footer>
  </form>

  <div class="modal-discard" data-confirm-box hidden>
    <div class="modal-discard__box" role="alertdialog" aria-labelledby="co-sure-title">
      <p class="modal-discard__title" id="co-sure-title" data-confirm-text>Are you sure?</p>
      <div class="modal-discard__actions">
        <button class="btn btn--primary" type="button" data-confirm-yes>Yes</button>
        <button class="btn btn--secondary" type="button" data-confirm-no>No</button>
      </div>
    </div>
  </div>
</dialog>
