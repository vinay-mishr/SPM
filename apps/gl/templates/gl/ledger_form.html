{# Shared Add / Modify / View form (old VFP "GENERAL LEDGER MASTER" window). ledger_master.js switches the mode. #}
<dialog class="modal gl-form-modal" id="gl-form-dialog" aria-labelledby="gl-form-title">
  <form class="gl-form" novalidate data-gl-form>
    <header class="modal__header">
      <h2 class="modal__title" id="gl-form-title">General Ledger Master — <span data-mode-label>Add</span></h2>
      <button class="modal__close" type="button" aria-label="Close" data-form-exit>&times;</button>
    </header>

    <div class="modal__body">
      <div class="alert alert--error form-alert" role="alert" data-form-alert hidden></div>

      <div class="mform glf">
        <label class="mform__label" for="gl-ledger_code">Ledger Code</label>
        <div class="mform__field">
          <input class="form-control mform__input mform__input--code" id="gl-ledger_code" type="text" readonly tabindex="-1" placeholder="Auto" data-field="ledger_code">
        </div>

        <label class="mform__label mform__label--required" for="gl-description">Description</label>
        <div class="mform__field">
          <input class="form-control mform__input" id="gl-description" name="description" type="text" maxlength="40" autocomplete="off" required data-field="description">
          <p class="mform__error" data-error-for="description"></p>
        </div>

        <label class="mform__label" for="gl-gl_type">Group</label>
        <div class="mform__field">
          <div class="glf-search-row">
            <input class="form-control mform__input glf-code" id="gl-gl_type" type="text" autocomplete="off" placeholder="Search group…" data-field="tree_search">
            <input type="hidden" data-field="gl_type">
          </div>
          <p class="mform__error" data-error-for="gl_type"></p>
        </div>

        <label class="mform__label mform__label--required" for="gl-group_code">Ledger Group</label>
        <div class="mform__field">
          <div class="glf-search-row">
            <input class="form-control mform__input glf-code" id="gl-group_code" type="text" list="gl-group-list" autocomplete="off" placeholder="Search group…" data-field="group_code_search">
            <input type="hidden" data-field="group_code">
          </div>
          <datalist id="gl-group-list" data-group-list></datalist>
          <p class="mform__error" data-error-for="group_code"></p>
        </div>

        <label class="mform__label" for="gl-opening_balance">Opening Bal.</label>
        <div class="mform__field">
          <input class="form-control mform__input mform__input--num" id="gl-opening_balance" name="opening_balance" type="text" inputmode="decimal" autocomplete="off" data-field="opening_balance">
          <p class="mform__error" data-error-for="opening_balance"></p>
        </div>
      </div>
    </div>

    <footer class="modal__footer">
      <button class="btn btn--primary" type="submit" data-form-confirm>Confirm</button>
      <button class="btn btn--secondary" type="button" data-form-exit>Exit</button>
    </footer>
  </form>

  <div class="modal-discard" data-discard hidden>
    <div class="modal-discard__box" role="alertdialog" aria-labelledby="gl-discard-title">
      <p class="modal-discard__title" id="gl-discard-title">Discard unsaved changes?</p>
      <div class="modal-discard__actions">
        <button class="btn btn--secondary" type="button" data-discard-cancel>Cancel</button>
        <button class="btn btn--primary" type="button" data-discard-confirm>Exit</button>
      </div>
    </div>
  </div>
</dialog>
