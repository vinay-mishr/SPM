{# Shared Add / Modify / View form (old VFP "UNIT ..." window). unit_master.js switches the mode. #}
<dialog class="modal unit-form-modal" id="unit-form-dialog" aria-labelledby="unit-form-title">
  <form class="unit-form" novalidate data-unit-form>
    <header class="modal__header">
      <h2 class="modal__title" id="unit-form-title">Unit Master — <span data-mode-label>Add</span></h2>
      <button class="modal__close" type="button" aria-label="Close" data-form-exit>&times;</button>
    </header>

    <div class="modal__body">
      <div class="alert alert--error form-alert" role="alert" data-form-alert hidden></div>

      <div class="mform">
        <label class="mform__label mform__label--required" for="unit-name">Unit</label>
        <div class="mform__field">
          <input class="form-control mform__input" id="unit-name" name="name" type="text" maxlength="3" autocomplete="off" required data-field="name">
          <p class="mform__error" data-error-for="name"></p>
        </div>
      </div>
    </div>

    <footer class="modal__footer">
      <button class="btn btn--primary" type="submit" data-form-confirm>Confirm</button>
      <button class="btn btn--secondary" type="button" data-form-exit>Exit</button>
    </footer>
  </form>

  <div class="modal-discard" data-discard hidden>
    <div class="modal-discard__box" role="alertdialog" aria-labelledby="unit-discard-title">
      <p class="modal-discard__title" id="unit-discard-title">Discard unsaved changes?</p>
      <div class="modal-discard__actions">
        <button class="btn btn--secondary" type="button" data-discard-cancel>Cancel</button>
        <button class="btn btn--primary" type="button" data-discard-confirm>Exit</button>
      </div>
    </div>
  </div>
</dialog>
