{# Shared ADD / MODIFY / VIEW form (old VFP "GST MASTER" window). gst_master.js switches the mode. #}
<dialog class="modal gst-form-modal" id="gst-form-dialog" aria-labelledby="gst-form-title">
  <form novalidate data-gst-form>
    <header class="modal__header">
      <h2 class="modal__title" id="gst-form-title">GST Master — <span data-mode-label>Add</span></h2>
      <button class="modal__close" type="button" aria-label="Close" data-form-exit>&times;</button>
    </header>

    <div class="modal__body">
      <div class="alert alert--error form-alert" role="alert" data-form-alert hidden></div>

      <div class="mform gst-rate-field">
        <label class="mform__label mform__label--required" for="gst-rate">GST %</label>
        <div class="mform__field">
          <input class="form-control mform__input" id="gst-rate" type="text" inputmode="decimal" maxlength="6" autocomplete="off" data-field="rate">
          <p class="mform__error" data-error-for="rate"></p>
        </div>
      </div>

      <div class="gst-columns">
        <fieldset class="gst-col" data-account-fields>
          <legend class="visually-hidden">Sale</legend>

          <h3 class="gst-section-title">Sale Taxfree Account</h3>
          <div class="gst-row">
            <label class="gst-row__label" for="gst-sale-taxfree-name">Sale GST</label>
            <input class="form-control gst-row__name" id="gst-sale-taxfree-name" type="text" autocomplete="off" data-account-search="sale_taxfree_account">
            <input class="form-control gst-row__code" type="text" maxlength="4" readonly tabindex="-1" data-account-code="sale_taxfree_account">
          </div>

          <h3 class="gst-section-title">Sale Within State</h3>
          <div class="gst-row">
            <label class="gst-row__label" for="gst-sale-account-name">Sale A/C</label>
            <input class="form-control gst-row__name" id="gst-sale-account-name" type="text" autocomplete="off" data-account-search="sale_account">
            <input class="form-control gst-row__code" type="text" maxlength="4" readonly tabindex="-1" data-account-code="sale_account">
          </div>
          <div class="gst-row">
            <label class="gst-row__label" for="gst-sale-cgst-name">Sale CGST</label>
            <input class="form-control gst-row__name" id="gst-sale-cgst-name" type="text" autocomplete="off" data-account-search="sale_cgst_account">
            <input class="form-control gst-row__code" type="text" maxlength="4" readonly tabindex="-1" data-account-code="sale_cgst_account">
          </div>
          <div class="gst-row">
            <label class="gst-row__label" for="gst-sale-sgst-name">Sale SGST</label>
            <input class="form-control gst-row__name" id="gst-sale-sgst-name" type="text" autocomplete="off" data-account-search="sale_sgst_account">
            <input class="form-control gst-row__code" type="text" maxlength="4" readonly tabindex="-1" data-account-code="sale_sgst_account">
          </div>

          <h3 class="gst-section-title">Sale Interstate</h3>
          <div class="gst-row">
            <label class="gst-row__label" for="gst-sale-interstate-name">Sale A/C</label>
            <input class="form-control gst-row__name" id="gst-sale-interstate-name" type="text" autocomplete="off" data-account-search="sale_interstate_account">
            <input class="form-control gst-row__code" type="text" maxlength="4" readonly tabindex="-1" data-account-code="sale_interstate_account">
          </div>
          <div class="gst-row">
            <label class="gst-row__label" for="gst-sale-igst-name">Sale IGST</label>
            <input class="form-control gst-row__name" id="gst-sale-igst-name" type="text" autocomplete="off" data-account-search="sale_igst_account">
            <input class="form-control gst-row__code" type="text" maxlength="4" readonly tabindex="-1" data-account-code="sale_igst_account">
          </div>
        </fieldset>

        <fieldset class="gst-col" data-account-fields>
          <legend class="visually-hidden">Purchase</legend>

          <h3 class="gst-section-title">Purchase Taxfree Account</h3>
          <div class="gst-row">
            <label class="gst-row__label" for="gst-purchase-taxfree-name">Purchase GST</label>
            <input class="form-control gst-row__name" id="gst-purchase-taxfree-name" type="text" autocomplete="off" data-account-search="purchase_taxfree_account">
            <input class="form-control gst-row__code" type="text" maxlength="4" readonly tabindex="-1" data-account-code="purchase_taxfree_account">
          </div>

          <h3 class="gst-section-title">Purchase Within State</h3>
          <div class="gst-row">
            <label class="gst-row__label" for="gst-purchase-account-name">Purchase A/C</label>
            <input class="form-control gst-row__name" id="gst-purchase-account-name" type="text" autocomplete="off" data-account-search="purchase_account">
            <input class="form-control gst-row__code" type="text" maxlength="4" readonly tabindex="-1" data-account-code="purchase_account">
          </div>
          <div class="gst-row">
            <label class="gst-row__label" for="gst-purchase-cgst-name">Purchase CGST</label>
            <input class="form-control gst-row__name" id="gst-purchase-cgst-name" type="text" autocomplete="off" data-account-search="purchase_cgst_account">
            <input class="form-control gst-row__code" type="text" maxlength="4" readonly tabindex="-1" data-account-code="purchase_cgst_account">
          </div>
          <div class="gst-row">
            <label class="gst-row__label" for="gst-purchase-sgst-name">Purchase SGST</label>
            <input class="form-control gst-row__name" id="gst-purchase-sgst-name" type="text" autocomplete="off" data-account-search="purchase_sgst_account">
            <input class="form-control gst-row__code" type="text" maxlength="4" readonly tabindex="-1" data-account-code="purchase_sgst_account">
          </div>

          <h3 class="gst-section-title">Purchase Interstate</h3>
          <div class="gst-row">
            <label class="gst-row__label" for="gst-purchase-interstate-name">Purchase A/C</label>
            <input class="form-control gst-row__name" id="gst-purchase-interstate-name" type="text" autocomplete="off" data-account-search="purchase_interstate_account">
            <input class="form-control gst-row__code" type="text" maxlength="4" readonly tabindex="-1" data-account-code="purchase_interstate_account">
          </div>
          <div class="gst-row">
            <label class="gst-row__label" for="gst-purchase-igst-name">Purchase IGST</label>
            <input class="form-control gst-row__name" id="gst-purchase-igst-name" type="text" autocomplete="off" data-account-search="purchase_igst_account">
            <input class="form-control gst-row__code" type="text" maxlength="4" readonly tabindex="-1" data-account-code="purchase_igst_account">
          </div>
        </fieldset>
      </div>
    </div>

    <footer class="modal__footer">
      <button class="btn btn--primary" type="submit" data-form-confirm>Confirm</button>
      <button class="btn btn--secondary" type="button" data-form-exit>Exit</button>
    </footer>
  </form>

  <div class="modal-discard" data-confirm-box hidden>
    <div class="modal-discard__box" role="alertdialog" aria-labelledby="gst-sure-title">
      <p class="modal-discard__title" id="gst-sure-title" data-confirm-text>Are you sure?</p>
      <div class="modal-discard__actions">
        <button class="btn btn--primary" type="button" data-confirm-yes>Yes</button>
        <button class="btn btn--secondary" type="button" data-confirm-no>No</button>
      </div>
    </div>
  </div>
</dialog>
