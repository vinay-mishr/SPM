{# Shared Add / Modify / View form. marketing_manager_form.js switches the mode. #}
<dialog class="modal mm-form-modal" id="mm-form-dialog" aria-labelledby="mm-form-title">
  <form novalidate data-mm-form>
    <header class="modal__header">
      <h2 class="modal__title" id="mm-form-title">Marketing Manager — <span data-mode-label>Add</span></h2>
      <button class="modal__close" type="button" aria-label="Close" data-form-exit>&times;</button>
    </header>

    <div class="modal__body">
      <div class="alert alert--error form-alert" role="alert" data-form-alert hidden></div>

      <div class="mform mm-form">
        <label class="mform__label" for="mm-code">Manager Code</label>
        <div class="mform__field">
          <input class="form-control mform__input mform__input--code mm-code" id="mm-code" type="text" readonly tabindex="-1" placeholder="Auto" data-field="code">
        </div>

        <label class="mform__label mform__label--required" for="mm-name">Manager Name</label>
        <div class="mform__field">
          <input class="form-control mform__input" id="mm-name" name="name" type="text" maxlength="25" autocomplete="off" data-field="name">
          <p class="mform__error" data-error-for="name"></p>
        </div>

        <label class="mform__label" for="mm-address_1">Address 1</label>
        <div class="mform__field">
          <input class="form-control mform__input" id="mm-address_1" name="address_1" type="text" maxlength="30" autocomplete="off" data-field="address_1">
          <p class="mform__error" data-error-for="address_1"></p>
        </div>

        <label class="mform__label" for="mm-address_2">Address 2</label>
        <div class="mform__field">
          <input class="form-control mform__input" id="mm-address_2" name="address_2" type="text" maxlength="30" autocomplete="off" data-field="address_2">
          <p class="mform__error" data-error-for="address_2"></p>
        </div>

        <label class="mform__label" for="mm-mobile">Mobile Number</label>
        <div class="mform__field">
          <input class="form-control mform__input mm-mid" id="mm-mobile" name="mobile" type="tel" inputmode="tel" maxlength="16" autocomplete="off" data-field="mobile">
          <p class="mform__error" data-error-for="mobile"></p>
        </div>
      </div>
    </div>

    <footer class="modal__footer">
      <button class="btn btn--primary" type="submit" data-form-confirm>Confirm</button>
      <button class="btn btn--secondary" type="button" data-form-exit>Exit</button>
    </footer>
  </form>

  <div class="modal-discard" data-discard hidden>
    <div class="modal-discard__box" role="alertdialog" aria-labelledby="mm-discard-title">
      <p class="modal-discard__title" id="mm-discard-title">Discard unsaved changes?</p>
      <div class="modal-discard__actions">
        <button class="btn btn--secondary" type="button" data-discard-cancel>Cancel</button>
        <button class="btn btn--primary" type="button" data-discard-confirm>Exit</button>
      </div>
    </div>
  </div>
</dialog>
