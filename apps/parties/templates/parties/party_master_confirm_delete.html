{# Delete confirmation: shows the party's details before anything is deleted. #}
<dialog class="modal modal--sm" id="party-delete-dialog" aria-labelledby="party-delete-title">
  <header class="modal__header">
    <h2 class="modal__title" id="party-delete-title">Customer Master — Delete</h2>
    <button class="modal__close" type="button" aria-label="Close" data-delete-cancel>&times;</button>
  </header>

  <div class="modal__body">
    <dl class="detail-list" data-delete-details></dl>
    <p class="modal-question">Are you sure you want to delete this party?</p>
    <div class="alert alert--error" role="alert" data-delete-alert hidden></div>
  </div>

  <footer class="modal__footer">
    <button class="btn btn--danger" type="button" data-delete-confirm>Delete</button>
    <button class="btn btn--secondary" type="button" data-delete-cancel>Exit</button>
  </footer>
</dialog>
